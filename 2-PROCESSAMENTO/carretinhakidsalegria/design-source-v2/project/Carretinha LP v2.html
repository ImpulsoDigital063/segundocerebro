<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Carretinha Kids Alegria — LP v2 · Design System + Mockups</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #f0eee9; }
  * { box-sizing: border-box; }
  /* Hide scrollbars inside artboards (mobile horizontal scroll) */
  .ck-no-scrollbar::-webkit-scrollbar { display: none; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="tokens.jsx"></script>
<script type="text/babel" src="lp-desktop-styles.jsx"></script>
<script type="text/babel" src="lp-desktop.jsx"></script>
<script type="text/babel" src="lp-mobile-styles.jsx"></script>
<script type="text/babel" src="lp-mobile.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  // Inject global hover / fade-up styles (defined in ui.jsx).
  injectGlobalStyles();

  // Intersection-observer fade-up — sets .in on any .ck-fade-up
  // that scrolls into view. Cheap stand-in for Framer Motion;
  // the Verbo replaces with Framer + variants in Next.
  function useScrollFadeUp() {
    React.useEffect(() => {
      const els = document.querySelectorAll('.ck-fade-up:not(.in)');
      const io = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            e.target.classList.add('in');
            io.unobserve(e.target);
          }
        });
      }, { threshold: 0.15 });
      els.forEach(el => io.observe(el));
      return () => io.disconnect();
    }, []);
  }

  const App = () => {
    useScrollFadeUp();
    return (
      <DesignCanvas>
        <DCSection id="system" title="Design System" subtitle="Tokens, tipografia, paleta, componentes-base. Tudo o que o Verbo precisa traduzir em theme + components no Next.">
          <DCArtboard id="tokens" label="01 · Tokens completos" width={1440} height={3400}>
            <TokensArtboard/>
          </DCArtboard>
        </DCSection>

        <DCSection id="lp" title="Landing Page · v2" subtitle="Hero → Footer. Mesma copy da v1 preservada. Foto real como peça central, paleta saturada-baixa, tipografia editorial. Mobile-first.">
          <DCArtboard id="desktop" label="02 · Desktop · 1440px" width={1440} height={8400}>
            <LPDesktop/>
          </DCArtboard>
          <DCArtboard id="mobile" label="03 · Mobile · 390px (base)" width={390} height={9200}>
            <LPMobile/>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  };

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
