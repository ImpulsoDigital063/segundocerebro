<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APPDELYVERY · Sistema</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#4f46e5; --brand-dark:#4338ca; --brand-2:#6366f1; --brand-light:#eef0ff; --brand-glow:rgba(79,70,229,.25);
    --go:#059669; --go-bg:#e7f7f0; --go-dark:#047857;
    --warn:#d97706; --warn-bg:#fef3e2;
    --ink:#0d1424; --ink-2:#33405c; --muted:#6b7894; --faint:#9aa6bf;
    --line:#e8ecf5; --line-2:#dde3f0; --bg:#f5f7fc; --card:#ffffff;
    --shadow:0 4px 24px rgba(23,37,84,.07), 0 1px 3px rgba(23,37,84,.05);
    --shadow-lg:0 12px 40px rgba(23,37,84,.13);
    --shadow-sm:0 1px 3px rgba(23,37,84,.07);
    --radius:16px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter',system-ui,sans-serif; color:var(--ink); background:var(--bg); overflow:hidden; -webkit-font-smoothing:antialiased;}
  ::-webkit-scrollbar{width:9px;} ::-webkit-scrollbar-thumb{background:var(--line-2); border-radius:6px; border:2px solid var(--bg);}

  /* HEADER */
  header{height:64px; background:rgba(255,255,255,.85); backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 22px; position:relative; z-index:30;}
  .logo{display:flex; align-items:center; gap:11px;}
  .logo .mark{width:38px; height:38px; border-radius:11px; background:linear-gradient(135deg,var(--brand),var(--brand-2));
    display:grid; place-items:center; color:#fff; box-shadow:0 4px 14px var(--brand-glow);}
  .logo .mark svg{width:21px;height:21px;}
  .logo .name{font-weight:800; font-size:20px; letter-spacing:-.6px; line-height:1;}
  .logo .name b{color:var(--brand);} .logo .name span{color:var(--ink);}
  .logo .sub{font-size:10.5px; color:var(--muted); font-weight:600; letter-spacing:.2px; margin-top:2px;}
  .tagline{font-size:11.5px; color:var(--muted); font-weight:600; margin-left:14px; padding-left:14px; border-left:1px solid var(--line-2); display:flex; align-items:center; gap:6px;}
  .tagline svg{width:14px;height:14px;color:var(--go);}

  /* SEGMENTED TABS */
  .tabs{display:flex; gap:4px; background:#eef1f8; padding:4px; border-radius:13px;}
  .tab{border:none; background:transparent; font-size:13px; font-weight:700; color:var(--muted);
    padding:9px 16px; border-radius:9px; cursor:pointer; transition:.18s; display:flex; align-items:center; gap:7px;}
  .tab svg{width:16px;height:16px;}
  .tab.active{background:var(--card); color:var(--brand); box-shadow:var(--shadow-sm);}
  .tab:not(.active):hover{color:var(--ink-2);}

  .demo-tag{font-size:10px; font-weight:800; color:var(--warn); background:var(--warn-bg); padding:5px 11px; border-radius:30px;
    text-transform:uppercase; letter-spacing:.6px; display:flex; align-items:center; gap:6px;}
  .demo-tag svg{width:12px;height:12px;}

  /* LAYOUT */
  .app{display:flex; height:calc(100vh - 64px);}
  .panel{width:418px; min-width:418px; background:var(--bg); overflow-y:auto; padding:20px;}
  #map{flex:1; position:relative; border-left:1px solid var(--line);}

  /* CARDS */
  .card{background:var(--card); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); margin-bottom:15px; border:1px solid var(--line);}
  .card-h{display:flex; align-items:center; gap:8px; margin-bottom:14px;}
  .card-h svg{width:15px; height:15px; color:var(--brand);}
  .card-h h3{font-size:11.5px; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); font-weight:800;}
  .card-h .right{margin-left:auto; font-size:11px; color:var(--faint); font-weight:700; text-transform:none; letter-spacing:0;}

  /* DRIVER */
  .driver{display:flex; gap:13px; align-items:center;}
  .avatar{width:54px; height:54px; border-radius:15px; background:linear-gradient(135deg,var(--brand-2),var(--brand-dark)); color:#fff;
    display:grid; place-items:center; font-weight:800; font-size:19px; flex-shrink:0; box-shadow:0 4px 12px var(--brand-glow);}
  .driver-info{flex:1;}
  .driver-info .name{font-weight:800; font-size:16.5px; letter-spacing:-.3px;}
  .driver-info .meta{font-size:12.5px; color:var(--muted); margin-top:3px; display:flex; align-items:center; gap:6px;}
  .rating{color:var(--warn); font-weight:800; display:inline-flex; align-items:center; gap:3px;}
  .rating svg{width:12px;height:12px;fill:var(--warn);stroke:none;}
  .verified-badges{display:flex; flex-wrap:wrap; gap:7px; margin-top:14px;}
  .vbadge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; color:var(--go-dark);
    background:var(--go-bg); padding:6px 10px; border-radius:9px;}
  .vbadge svg{width:13px; height:13px;}
  .trust-banner{margin-top:14px; background:linear-gradient(135deg,var(--go-bg),#d6f3e6); border:1px solid #aee4c8;
    border-radius:11px; padding:12px 13px; font-size:12.5px; color:var(--go-dark); font-weight:600; display:flex; gap:10px; align-items:center; line-height:1.45;}
  .trust-banner svg{width:22px;height:22px;flex-shrink:0;}

  /* ETA */
  .eta-row{display:flex; gap:12px;}
  .eta-box{flex:1; background:linear-gradient(135deg,var(--brand-light),#f3f4ff); border-radius:13px; padding:14px; text-align:center; border:1px solid #e0e3ff;}
  .eta-box .big{font-size:27px; font-weight:800; color:var(--brand); letter-spacing:-1px; line-height:1;}
  .eta-box .lbl{font-size:11px; color:var(--muted); font-weight:700; margin-top:5px; text-transform:uppercase; letter-spacing:.4px;}

  /* TIMELINE */
  .timeline{position:relative;}
  .step{display:flex; gap:13px; padding-bottom:18px; position:relative;}
  .step:last-child{padding-bottom:0;}
  .step::before{content:''; position:absolute; left:10px; top:23px; bottom:-2px; width:2px; background:var(--line-2);}
  .step:last-child::before{display:none;}
  .step.done::before{background:var(--go);}
  .dot{width:22px; height:22px; border-radius:50%; border:2px solid var(--line-2); background:var(--card); flex-shrink:0; z-index:1; display:grid; place-items:center; transition:.2s;}
  .dot svg{width:12px;height:12px;color:#fff;opacity:0; transition:.2s;}
  .step.done .dot{background:var(--go); border-color:var(--go);}
  .step.done .dot svg{opacity:1;}
  .step.active .dot{background:var(--brand); border-color:var(--brand); animation:pulse 1.5s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 var(--brand-glow);}70%{box-shadow:0 0 0 9px rgba(79,70,229,0);}100%{box-shadow:0 0 0 0 rgba(79,70,229,0);}}
  .step-txt .t{font-weight:700; font-size:14px; letter-spacing:-.2px;}
  .step.pending .step-txt .t{color:var(--faint); font-weight:600;}
  .step-txt .s{font-size:12px; color:var(--muted); margin-top:2px;}
  .step.pending .step-txt .s{color:var(--faint);}

  /* PRICE */
  .price-line{display:flex; justify-content:space-between; font-size:13px; padding:6px 0; color:var(--muted);}
  .price-line span:last-child{color:var(--ink-2); font-weight:600;}
  .price-line.total{border-top:1.5px dashed var(--line-2); margin-top:8px; padding-top:12px; font-size:18px; font-weight:800; color:var(--ink);}
  .price-line.total span:last-child{color:var(--brand); font-size:22px; letter-spacing:-.5px;}
  .price-sub{font-size:11.5px;color:var(--faint);text-align:right;margin-top:3px;}

  /* FORM */
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:11.5px; font-weight:700; color:var(--ink-2); margin-bottom:6px; letter-spacing:.1px;}
  .field .input{width:100%; border:1.5px solid var(--line-2); border-radius:11px; padding:11px 13px; font-size:13.5px; font-family:inherit; color:var(--ink); background:#fbfcfe; transition:.15s;}
  .field .input:focus{outline:none; border-color:var(--brand); background:#fff; box-shadow:0 0 0 3px var(--brand-light);}
  .field .input::placeholder{color:var(--faint);}
  .with-icon{position:relative;}
  .with-icon svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--muted);}
  .with-icon .input{padding-left:38px;}
  .veh-toggle{display:flex; gap:8px;}
  .veh-opt{flex:1; border:1.5px solid var(--line-2); border-radius:11px; padding:11px; display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer; transition:.15s; background:#fbfcfe;}
  .veh-opt svg{width:22px;height:22px;color:var(--muted);}
  .veh-opt .vl{font-size:12px;font-weight:700;color:var(--muted);}
  .veh-opt.sel{border-color:var(--brand); background:var(--brand-light);}
  .veh-opt.sel svg, .veh-opt.sel .vl{color:var(--brand);}

  /* UPLOAD */
  .upload{display:flex; align-items:center; gap:11px; border:1.5px dashed var(--line-2); border-radius:11px; padding:13px; cursor:pointer; transition:.15s; background:#fbfcfe;}
  .upload:hover{border-color:var(--brand); background:var(--brand-light);}
  .upload.done{border-style:solid; border-color:var(--go); background:var(--go-bg);}
  .upload .ic{width:36px;height:36px;border-radius:9px;background:var(--brand-light);display:grid;place-items:center;flex-shrink:0;}
  .upload .ic svg{width:18px;height:18px;color:var(--brand);}
  .upload.done .ic{background:#cdeedd;} .upload.done .ic svg{color:var(--go-dark);}
  .upload .ut{font-size:13px;font-weight:700;} .upload .us{font-size:11px;color:var(--muted);margin-top:1px;}

  /* VERIFY CHECKLIST */
  .vcheck{display:flex; align-items:center; gap:12px; padding:13px; border-radius:11px; background:#fbfcfe; border:1px solid var(--line); margin-bottom:9px; opacity:.45; transition:.4s;}
  .vcheck.run{opacity:1; border-color:var(--brand-light);}
  .vcheck.ok{opacity:1; background:var(--go-bg); border-color:#aee4c8;}
  .vcheck .vc-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;background:var(--line);}
  .vcheck.run .vc-ic{background:var(--brand-light);}
  .vcheck.ok .vc-ic{background:#cdeedd;}
  .vcheck .vc-ic svg{width:17px;height:17px;color:var(--muted);}
  .vcheck.run .vc-ic svg{color:var(--brand); animation:spin 1s linear infinite;}
  .vcheck.ok .vc-ic svg{color:var(--go-dark); animation:none;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .vcheck .vc-t{font-size:13.5px;font-weight:700;flex:1;}
  .vcheck .vc-s{font-size:11px;color:var(--muted);}

  /* BUTTONS */
  .btn{width:100%; border:none; border-radius:12px; padding:14px; font-size:14.5px; font-weight:800; cursor:pointer; transition:.15s; display:flex; align-items:center; justify-content:center; gap:9px; font-family:inherit; letter-spacing:.1px;}
  .btn svg{width:18px;height:18px;}
  .btn-primary{background:var(--brand); color:#fff; box-shadow:0 4px 14px var(--brand-glow);} .btn-primary:hover{background:var(--brand-dark);}
  .btn-go{background:var(--go); color:#fff; box-shadow:0 4px 14px rgba(5,150,105,.25);} .btn-go:hover{background:var(--go-dark);}
  .btn-ghost{background:var(--card); color:var(--brand); border:1.5px solid var(--line-2);}
  .btn-ghost:hover{border-color:var(--brand);}
  .btn:disabled{opacity:.5; cursor:default; box-shadow:none;}
  .btn-row{display:flex;gap:10px;} .btn-row .btn{margin:0;}

  /* MATCHING RADAR */
  .radar-wrap{display:flex;flex-direction:column;align-items:center;padding:18px 0 6px;}
  .radar{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,var(--brand-light),#fff);position:relative;display:grid;place-items:center;}
  .radar::before,.radar::after{content:'';position:absolute;border:2px solid var(--brand);border-radius:50%;opacity:0;animation:radar 2s infinite;}
  .radar::before{width:100%;height:100%;} .radar::after{width:100%;height:100%;animation-delay:1s;}
  @keyframes radar{0%{transform:scale(.3);opacity:.8;}100%{transform:scale(1);opacity:0;}}
  .radar .rc{width:54px;height:54px;border-radius:15px;background:var(--brand);display:grid;place-items:center;z-index:1;box-shadow:0 6px 18px var(--brand-glow);}
  .radar .rc svg{width:26px;height:26px;color:#fff;}

  /* PHOTO PROOF */
  .photo{position:relative;border-radius:12px;overflow:hidden;height:130px;background:linear-gradient(135deg,#3b4a6b,#1f2940);display:grid;place-items:center;}
  .photo .pkg{width:46px;height:46px;color:rgba(255,255,255,.85);}
  .photo .geo{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.7));padding:18px 11px 9px;color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;gap:6px;}
  .photo .geo svg{width:12px;height:12px;}

  /* SIGNATURE */
  .sigpad{border:1.5px solid var(--line-2);border-radius:12px;background:#fbfcfe;touch-action:none;cursor:crosshair;width:100%;display:block;}
  .sig-hint{font-size:11.5px;color:var(--faint);text-align:center;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:6px;}
  .sig-hint svg{width:13px;height:13px;}

  /* KPIs */
  .kpis{display:grid; grid-template-columns:1fr 1fr 1fr; gap:11px; margin-bottom:15px;}
  .kpi{background:var(--card); border-radius:14px; padding:15px; box-shadow:var(--shadow); border:1px solid var(--line);}
  .kpi .ic{width:30px;height:30px;border-radius:8px;background:var(--brand-light);display:grid;place-items:center;margin-bottom:9px;}
  .kpi .ic svg{width:15px;height:15px;color:var(--brand);}
  .kpi .v{font-size:23px; font-weight:800; letter-spacing:-.8px; line-height:1;}
  .kpi .l{font-size:10px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.4px; margin-top:5px;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.5px; padding:7px 4px; border-bottom:1px solid var(--line); font-weight:800;}
  td{padding:11px 4px; border-bottom:1px solid var(--line); font-weight:500;}
  tr:last-child td{border-bottom:none;}
  .td-name{font-weight:700;}
  .status-pill{font-size:10px; font-weight:800; padding:4px 9px; border-radius:30px; display:inline-flex; align-items:center; gap:4px; white-space:nowrap;}
  .status-pill svg{width:10px;height:10px;}
  .s-ok{background:var(--go-bg); color:var(--go-dark);}
  .s-pend{background:var(--warn-bg); color:var(--warn);}
  .s-live{background:var(--brand-light); color:var(--brand);}

  /* OFFER */
  .offer-amount{font-size:38px; font-weight:900; color:var(--go); text-align:center; margin:8px 0 2px; letter-spacing:-1.5px;}
  .offer-sub{text-align:center;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px;}
  .route-pts{display:flex; flex-direction:column; gap:0; margin:16px 0; position:relative;}
  .route-pts::before{content:'';position:absolute;left:5px;top:14px;bottom:14px;width:2px;background:var(--line-2);}
  .rpt{display:flex; gap:13px; align-items:flex-start; padding:7px 0; position:relative;}
  .rpt .pin{width:12px;height:12px;border-radius:50%;margin-top:3px;flex-shrink:0;z-index:1;border:2px solid #fff;box-shadow:0 0 0 1px var(--line-2);}
  .rpt .pin.o{background:var(--brand);} .rpt .pin.d{background:var(--go);}
  .rpt .txt .a{font-weight:700;font-size:13.5px;} .rpt .txt .b{font-size:11.5px;color:var(--muted);margin-top:1px;}
  .countdown{text-align:center; font-size:12px; color:var(--muted); margin-top:10px; font-weight:600;}
  .countdown b{color:var(--brand);}

  .hint{font-size:11.5px;color:var(--faint);text-align:center;margin-top:10px;line-height:1.6;}
  .earn-big{font-size:40px;font-weight:900;color:var(--go);text-align:center;letter-spacing:-1.5px;margin:6px 0;}
  .done-hero{text-align:center;padding:8px 0;}
  .done-hero .circle{width:72px;height:72px;border-radius:50%;background:var(--go-bg);display:grid;place-items:center;margin:0 auto 12px;}
  .done-hero .circle svg{width:36px;height:36px;color:var(--go);}
  .done-hero .t{font-size:19px;font-weight:800;letter-spacing:-.4px;}
  .done-hero .s{font-size:13px;color:var(--muted);margin-top:4px;}

  /* MAP overlay */
  .map-badge{position:absolute;top:16px;left:16px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);padding:9px 15px;border-radius:30px;
    box-shadow:var(--shadow-lg);font-size:13px;font-weight:700;z-index:5;display:flex;align-items:center;gap:9px;}
  .map-badge .pulse-dot{width:9px;height:9px;border-radius:50%;background:var(--go);box-shadow:0 0 0 0 rgba(5,150,105,.5);animation:pulse2 1.6s infinite;}
  @keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(5,150,105,.5);}70%{box-shadow:0 0 0 7px rgba(5,150,105,0);}100%{box-shadow:0 0 0 0 rgba(5,150,105,0);}}
  .moto-marker{width:42px;height:42px;background:var(--brand);border-radius:50%;border:3px solid #fff;
    box-shadow:0 4px 14px rgba(0,0,0,.35);display:grid;place-items:center;color:#fff;}
  .moto-marker svg{width:23px;height:23px;}
  .pt-marker{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.3);display:grid;place-items:center;}
  .pt-marker svg{width:13px;height:13px;color:#fff;transform:rotate(45deg);}
  .pt-marker.o{background:var(--brand);} .pt-marker.d{background:var(--go);}

  /* ===== SITE PÚBLICO (vitrine) ===== */
  #siteOverlay{position:fixed;inset:0;z-index:200;background:var(--bg);overflow-y:auto;display:none;}
  #siteOverlay.show{display:block;}
  .s-nav{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 6%;z-index:5;}
  .s-nav .menu{display:flex;gap:24px;align-items:center;}
  .s-nav .menu a{font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer;text-decoration:none;}
  .s-nav .menu a:hover{color:var(--brand);}
  .s-navbtn{border:none;background:var(--brand);color:#fff;border-radius:10px;padding:10px 18px;font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit;}
  .s-wrap{max-width:1060px;margin:0 auto;padding:0 6%;}
  .s-hero{text-align:center;padding:64px 0 36px;}
  .s-trust{display:inline-flex;align-items:center;gap:7px;background:var(--go-bg);color:var(--go-dark);font-weight:800;font-size:12px;padding:7px 14px;border-radius:30px;margin-bottom:22px;text-transform:uppercase;letter-spacing:.5px;}
  .s-trust svg{width:14px;height:14px;}
  .s-hero h1{font-size:46px;font-weight:900;letter-spacing:-1.8px;line-height:1.06;color:var(--h1);max-width:780px;margin:0 auto;}
  .s-hero h1 .hl{color:var(--brand);}
  .s-hero p{font-size:17px;color:var(--ink-2);max-width:600px;margin:20px auto 0;line-height:1.6;}
  .s-cta{display:flex;gap:14px;justify-content:center;margin-top:30px;flex-wrap:wrap;}
  .s-btn{border:none;border-radius:12px;padding:15px 26px;font-size:15px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:9px;font-family:inherit;}
  .s-btn svg{width:18px;height:18px;}
  .s-btn.p{background:var(--brand);color:#fff;box-shadow:0 8px 22px var(--brand-glow);}
  .s-btn.p:hover{background:var(--brand-dark);}
  .s-btn.g{background:#fff;color:var(--brand);border:1.5px solid var(--line-2);}
  .s-doors{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:24px 0 12px;}
  .s-door{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:var(--shadow);}
  .s-door.dark{background:linear-gradient(160deg,var(--h1),var(--brand-dark));}
  .s-door.dark *{color:#fff !important;}
  .s-door.dark .ic{background:rgba(255,255,255,.15);}
  .s-door .ic{width:50px;height:50px;border-radius:14px;background:var(--brand-light);display:grid;place-items:center;margin-bottom:16px;}
  .s-door .ic svg{width:25px;height:25px;color:var(--brand);}
  .s-door h3{font-size:21px;font-weight:800;letter-spacing:-.4px;}
  .s-door .d{font-size:13.5px;color:var(--muted);margin-top:6px;}

<script>
// ===================== ÍCONES SVG (zero emoji) =====================
const I = {

  money:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.2c0-1 1.1-1.7 2.5-1.7s2.5.7 2.5 1.7-1.1 1.6-2.5 1.6-2.5.7-2.5 1.7 1.1 1.7 2.5 1.7 2.5-.7 2.5-1.7"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>',
  bolt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10"/></svg>',
};
function svg(name){return I[name]||'';}

// ===================== DADOS PALMAS-TO =====================
const PALMAS=[-48.3336,-10.1844];
const ORIGEM={lng:-48.3401,lat:-10.1701,nome:"Ótica Visão Center",end:"Q. 104 Norte, Av. JK"};
const DESTINO={lng:-48.3209,lat:-10.2008,nome:"Andrade Contabilidade",end:"Q. 304 Sul, Av. NS-2"};
function buildRoute(o,d,n){
  const wp=[[o.lng,o.lat],[-48.3360,-10.1790],[-48.3300,-10.1850],[-48.3270,-10.1920],[-48.3230,-10.1970],[d.lng,d.lat]];
  const pts=[];
  for(let s=0;s<wp.length-1;s++){const a=wp[s],b=wp[s+1];for(let i=0;i<24;i++){const t=i/24;pts.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);}}
  pts.push([d.lng,d.lat]); return pts;
}
let ROUTE=buildRoute(ORIGEM,DESTINO);
let DIST_KM=6.3, DUR_MIN=10;
function densify(coords,n){
  const d=[0]; for(let i=1;i<coords.length;i++){const dx=coords[i][0]-coords[i-1][0],dy=coords[i][1]-coords[i-1][1];d.push(d[i-1]+Math.hypot(dx,dy));}
  const total=d[d.length-1]||1; const out=[];
  for(let k=0;k<n;k++){const tg=total*k/(n-1); let i=1; while(i<d.length&&d[i]<tg)i++; const t=(tg-d[i-1])/((d[i]-d[i-1])||1);
    out.push([coords[i-1][0]+(coords[i][0]-coords[i-1][0])*t, coords[i-1][1]+(coords[i][1]-coords[i-1][1])*t]);}
  return out;
}

// ===================== ESTADO =====================
let persona='negocio';
let veh='moto';
let sim={running:false,frac:0,step:0,timer:null};

// ===== TABELA DE PREÇO REAL (ajustável) =====
const PRICE={ baseMoto:8.00, baseCarro:13.00, perKm:1.50, min:10.00, driverPct:0.80 };
const money=v=>'R$ '+(v).toFixed(2).replace('.',',');
const NV={form:'form',matching:'matching',tracking:'tracking',done:'done'};
let negocioView='landing';   // landing → cadastro → form(painel) → matching → tracking → done
let cadStep=1;               // passo do cadastro (1..3)
let entregadorView='cadastro'; // cadastro→verificando→disponivel→coleta→rota→finalizar→concluido
let cnhUp=false,crlvUp=false,selfieUp=false;
let coletaFoto=false, sigData=null;

const STEPS=[
  {t:"Pedido aceito",s:"Lucas confirmou a corrida"},
  {t:"A caminho da coleta",s:"Indo até a Ótica Visão Center"},
  {t:"Encomenda coletada",s:"Foto registrada na coleta"},
  {t:"A caminho da entrega",s:"Levando até o destino"},
  {t:"Entregue",s:"Foto + assinatura do destinatário"},
];

// ===================== MAPA =====================
let map,moto,routeReady=false,CUM=[],TOTAL=1;
mapboxgl.accessToken='MAPBOX_TOKEN_REDACTED';
map=new mapboxgl.Map({
  container:'map',
  style:'mapbox://styles/mapbox/streets-v12',
  center:PALMAS,zoom:13.2
});
map.addControl(new mapboxgl.NavigationControl({showCompass:false}),'bottom-right');

// distância em metros entre 2 coords (haversine simplificado)
function geoDist(a,b){const R=6371000,r=Math.PI/180;const dLat=(b[1]-a[1])*r,dLng=(b[0]-a[0])*r,la=(a[1]+b[1])/2*r;const x=dLng*Math.cos(la),y=dLat;return Math.sqrt(x*x+y*y)*R;}
function indexRoute(){CUM=[0];for(let i=1;i<ROUTE.length;i++)CUM.push(CUM[i-1]+geoDist(ROUTE[i-1],ROUTE[i]));TOTAL=CUM[CUM.length-1]||1;}
// ponto exato sobre a linha na fração [0..1] — garante o motoboy COLADO na rua
function posAt(frac){const tg=TOTAL*Math.min(1,Math.max(0,frac));let i=1;while(i<CUM.length&&CUM[i]<tg)i++;const a=ROUTE[i-1],b=ROUTE[i]||a;const seg=(CUM[i]-CUM[i-1])||1,t=(tg-CUM[i-1])/seg;return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];}

map.on('load',async()=>{ await setupRoute(); });
async function setupRoute(){
  // 1) busca a rota REAL pelas ruas (Directions) ANTES de desenhar — evita o "pulo"
  try{
    const c=`${ORIGEM.lng},${ORIGEM.lat};${DESTINO.lng},${DESTINO.lat}`;
    const u=`https://api.mapbox.com/directions/v5/mapbox/driving/${c}?geometries=geojson&overview=full&access_token=${mapboxgl.accessToken}`;
    const d=await (await fetch(u)).json();
    if(d.routes&&d.routes[0]){const rt=d.routes[0];ROUTE=rt.geometry.coordinates;DIST_KM=+(rt.distance/1000).toFixed(2);DUR_MIN=Math.max(1,Math.round(rt.duration/60));}
  }catch(e){/* fallback: rota aproximada */}
  indexRoute();
  // 2) desenha a linha exata da rua
  map.addSource('route',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:ROUTE}}});
  map.addLayer({id:'route-bg',type:'line',source:'route',paint:{'line-color':'#fff','line-width':10,'line-opacity':.95},layout:{'line-cap':'round','line-join':'round'}});
  map.addLayer({id:'route',type:'line',source:'route',paint:{'line-color':'#4f46e5','line-width':5},layout:{'line-cap':'round','line-join':'round'}});
  // 3) pinos + motoboy
  pin(ORIGEM,'o','pin'); pin(DESTINO,'d','pkg');
  const el=document.createElement('div'); el.className='moto-marker'; el.innerHTML=svg('moto');
  moto=new mapboxgl.Marker({element:el}).setLngLat(ROUTE[0]).addTo(map);
  fitRoute(); routeReady=true; render();
}
function pin(p,cls,ic){const el=document.createElement('div');el.className='pt-marker '+cls;el.innerHTML=svg(ic);
  new mapboxgl.Marker({element:el,anchor:'bottom'}).setLngLat([p.lng,p.lat]).setPopup(new mapboxgl.Popup({offset:20}).setText(p.nome)).addTo(map);}
function fitRoute(){const b=new mapboxgl.LngLatBounds();ROUTE.forEach(c=>b.extend(c));map.fitBounds(b,{padding:90,duration:800});}

// ===================== SIMULAÇÃO GPS (suave, colada na rua) =====================
function startSim(){
  if(sim.running||!routeReady)return; sim.running=true; sim.frac=0; sim.step=0; render();
  sim.timer=setInterval(()=>{
    sim.frac=Math.min(1,sim.frac+0.009);
    const ll=posAt(sim.frac);
    if(moto)moto.setLngLat(ll);
    map.easeTo({center:ll,duration:230});
    const f=sim.frac; let ns=0;
    if(f>0.02)ns=1; if(f>0.32)ns=2; if(f>0.42)ns=3; if(f>=0.999)ns=4;
    if(ns!==sim.step){sim.step=ns; render();} else liveBits();
    if(sim.frac>=1){clearInterval(sim.timer); sim.running=false; render();}
  },150);
}
function resetSim(){clearInterval(sim.timer);sim.running=false;sim.frac=0;sim.step=0;if(moto&&ROUTE[0])moto.setLngLat(ROUTE[0]);fitRoute();}
function eta(){const frac=1-Math.min(1,Math.max(0,sim.frac));return{min:Math.max(0,Math.round(frac*DUR_MIN)),km:(frac*DIST_KM).toFixed(1)};}
function liveBits(){
  const e=eta(),done=sim.step>=4;
  const em=document.getElementById('etaMin'),ek=document.getElementById('etaKm');
  if(em)em.textContent=done?'0':e.min; if(ek)ek.textContent=done?'0,0':e.km;
  const mb=document.getElementById('mapBadge');
  if(mb)mb.textContent=done?'Entrega concluída':'Lucas a caminho · '+e.min+' min';
}

// ===================== SHELL (sidebar + topbar) — padrão SaaS AgendaPRO/Palace =====================
const NAV={
  negocio:[
    {g:'Operação',items:[{ic:'send',l:'Nova entrega',v:'form'},{ic:'moto',l:'Em andamento',v:'tracking'},{ic:'list',l:'Histórico',badge:'em breve'}]},

function priceCalc(){
  const base=veh==='moto'?PRICE.baseMoto:PRICE.baseCarro;

  return{base,dist,total,aplicouMin,driver:+(total*PRICE.driverPct).toFixed(2),taxa:+(total*(1-PRICE.driverPct)).toFixed(2)};
}

// ---------- ASSINATURA (canvas) ----------
let sigCtx,sigDrawing=false;
function initSig(){
  const c=document.getElementById('sig'); if(!c)return;
  c.width=c.offsetWidth; sigCtx=c.getContext('2d');
  sigCtx.lineWidth=2.5; sigCtx.lineCap='round'; sigCtx.strokeStyle='#0d1424';
  const pos=e=>{const r=c.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return[t.clientX-r.left,t.clientY-r.top];};
  const down=e=>{sigDrawing=true;const[x,y]=pos(e);sigCtx.beginPath();sigCtx.moveTo(x,y);e.preventDefault();};
  const move=e=>{if(!sigDrawing)return;const[x,y]=pos(e);sigCtx.lineTo(x,y);sigCtx.stroke();e.preventDefault();};
  const up=()=>{sigDrawing=false;};
  c.onmousedown=down;c.onmousemove=move;window.addEventListener('mouseup',up);
  c.ontouchstart=down;c.ontouchmove=move;c.ontouchend=up;
}
function clearSig(e){e.preventDefault();const c=document.getElementById('sig');if(c&&sigCtx)sigCtx.clearRect(0,0,c.width,c.height);}
function confirmDelivery(){const c=document.getElementById('sig');if(c)sigData=c.toDataURL();entregadorView='concluido';render();}
